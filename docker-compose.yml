name: mini-crm

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &default-restart
  unless-stopped

services:
  db:
    image: postgres:18-alpine
    restart: *default-restart
    environment:
      POSTGRES_USER: minicrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: minicrm
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicrm -d minicrm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      [backend]
    logging: *default-logging

  valkey:
    image: valkey/valkey:9-alpine
    restart: *default-restart
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${VALKEY_PASSWORD}
    environment:
      REDISCLI_AUTH: ${VALKEY_PASSWORD}
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  valkeydata:
