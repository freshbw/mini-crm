[project]
name = "app"
version = "0.1.0"
description = "Backend for mini-crm system"
readme = "README.md"
authors = [
    { name = "freshbw", email = "matvei.dmitrijev1@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "ASYNC",
    "FAST",
    "S",
    "ARG",
    "N",
    "RUF",
    "COM",
]
ignore = [
    "E501",   # line length handled by formatter
    "COM812", # conflicts with ruff format
    "S104",   # allow 0.0.0.0 bind in servers
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
packages = ["app"]
strict = true
disallow_untyped_defs = false
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
