name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: backend/.python-version

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        env:
          POSTGRES__PASSWORD: test
          VALKEY__PASSWORD: test

          EMAIL__SMTP__HOST: smtp.example.com
          EMAIL__SMTP__USER: test@example.com
          EMAIL__SMTP__PASSWORD: test

          EMAIL__IMAP__HOST: imap.example.com
          EMAIL__IMAP__USER: test@example.com
          EMAIL__IMAP__PASSWORD: test

          TELEGRAM__BOT_TOKEN: test
        run: uv run pytest
