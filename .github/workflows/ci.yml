name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version-file: backend/.python-version

      - name: Install dependencies
        run: make install

      - name: Run quality checks
        run: make check
        env:
          POSTGRES__PASSWORD: test
          VALKEY__PASSWORD: test

          EMAIL__SMTP__HOST: smtp.example.com
          EMAIL__SMTP__USER: test@example.com
          EMAIL__SMTP__PASSWORD: test

          EMAIL__IMAP__HOST: imap.example.com
          EMAIL__IMAP__USER: test@example.com
          EMAIL__IMAP__PASSWORD: test

          TELEGRAM__BOT_TOKEN: test
